name: Sonar code quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

jobs:
  sonar:
    name: Sonar quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Sonar configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SONAR_TOKEN" && -n "$SONAR_PROJECT_KEY" && -n "$SONAR_ORGANIZATION" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sonar is disabled. Configure SONAR_TOKEN, SONAR_PROJECT_KEY and SONAR_ORGANIZATION."
          fi
      - uses: actions/checkout@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          global-json-file: global.json
      - name: Install pinned SonarScanner
        if: steps.config.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner --version 11.2.1
      - name: Begin analysis
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: >-
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.qualitygate.wait=true
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/*.trx"
      - name: Build
        if: steps.config.outputs.enabled == 'true'
        run: dotnet build RideBound.slnx --configuration Release --no-incremental
      - name: Test with coverage
        if: steps.config.outputs.enabled == 'true'
        run: >-
          dotnet test RideBound.slnx
          --no-build
          --configuration Release
          --logger "trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: End analysis and enforce quality gate
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
