name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  code-format:
    name: Code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore RideBound.slnx
      - name: Verify formatting
        run: >-
          dotnet format whitespace RideBound.slnx
          --no-restore
          --verify-no-changes

  build-test:
    name: Build, test and coverage
    needs: code-format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore RideBound.slnx
      - name: Build
        run: >-
          dotnet build RideBound.slnx
          --no-restore
          --configuration Release
          -p:ContinuousIntegrationBuild=true
      - name: Test with coverage
        run: >-
          dotnet test RideBound.slnx
          --no-build
          --configuration Release
          --logger "trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: error
          retention-days: 14

  package-audit:
    name: NuGet vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore RideBound.slnx
      - name: Report vulnerable transitive packages
        run: >-
          dotnet list RideBound.slnx package
          --vulnerable
          --include-transitive

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  package-runner:
    name: Package runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, package-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish deterministic runner
        run: >-
          dotnet publish src/RideBound.Runner/RideBound.Runner.csproj
          --configuration Release
          --output artifacts/runner
          -p:ContinuousIntegrationBuild=true
      - name: Upload runner
        uses: actions/upload-artifact@v7
        with:
          name: ridebound-runner-${{ github.sha }}
          path: artifacts/runner
          if-no-files-found: error
          retention-days: 30
